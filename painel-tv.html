<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artezzi — Painel de produção</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-elev: #151822;
    --bg-card: #1b2030;
    --line: #2a3146;
    --text: #f4f1ea;
    --muted: #9aa3b8;
    --accent: #C9A24A;
    --ok: #3dd68c;
    --atencao: #f5c542;
    --urgente: #ff8a3d;
    --atrasado: #ff4d6d;
    --sem: #6b7388;
    --pago: #4c6fff;
    --mat: #ff8a3d;
    --prod: #3dd68c;
    --pronto: #C9A24A;
    --env: #5ee1f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; padding: 18px 22px 16px; }
  header { display: flex; align-items: center; justify-content: space-between;
    gap: 24px; padding-bottom: 14px; border-bottom: 1px solid rgba(201, 162, 74, 0.35); }
  .brand { display: flex; flex-direction: column; gap: 6px; }
  .brand img.logo {
    display: block;
    height: 92px;
    width: auto;
    max-width: 360px;
  }
  .brand p { font-size: 15px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .clock { text-align: right; }
  .clock .time { font-size: 48px; font-variant-numeric: tabular-nums; font-weight: 700; line-height: 1; }
  .clock .date { font-size: 18px; color: var(--muted); margin-top: 4px; }
  .board { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;
    min-height: 0; margin-top: 16px; }
  .col { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 16px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .col-h { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  .col-h h2 { font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
  .count { min-width: 36px; height: 36px; padding: 0 10px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; background: #0006; }
  .col.pago .col-h { color: var(--pago); }
  .col.aguardando_material .col-h { color: var(--mat); }
  .col.em_producao .col-h { color: var(--prod); }
  .col.pronto .col-h { color: var(--pronto); }
  .col.enviado .col-h { color: var(--env); }
  .cards { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 14px 12px; border-left: 6px solid var(--sem); }
  .card.ok { border-left-color: var(--ok); }
  .card.atencao { border-left-color: var(--atencao); }
  .card.urgente { border-left-color: var(--urgente); }
  .card.atrasado { border-left-color: var(--atrasado); background: #2a1520; }
  .card.sem_prazo { border-left-color: var(--sem); }
  .card.bloqueado { box-shadow: inset 0 0 0 2px var(--mat); background: #24180e; }
  .sku { font-size: 15px; color: var(--muted); letter-spacing: 0.04em; }
  .nome { font-size: 22px; font-weight: 700; line-height: 1.2; margin: 4px 0 8px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 16px; }
  .badge { border-radius: 999px; padding: 4px 10px; font-weight: 700; font-size: 15px; }
  .badge.ok { background: #143326; color: var(--ok); }
  .badge.atencao { background: #3a2f0a; color: var(--atencao); }
  .badge.urgente { background: #3a1d08; color: var(--urgente); }
  .badge.atrasado { background: #3a0d18; color: var(--atrasado); }
  .badge.sem_prazo { background: #222; color: var(--sem); }
  .qtd { color: var(--muted); }
  .faltas { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #3a2a16; }
  .faltas strong { color: var(--mat); font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; }
  .faltas ul { margin: 6px 0 0 18px; font-size: 16px; }
  .faltas li { margin: 2px 0; }
  .empty-col { color: var(--muted); font-size: 16px; padding: 12px; text-align: center; }
  .empty { flex: 1; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; color: var(--muted); }
  .empty h2 { font-size: 36px; color: var(--text); }
  .empty p { font-size: 22px; }
  footer { display: flex; justify-content: space-between; color: var(--muted);
    font-size: 14px; padding-top: 10px; }
  .err { color: var(--atrasado); }
</style>
</head>

  </header>
  <div id="root" class="board"></div>
  <footer>
    <span id="status">Atualizando…</span>
    <span>Atualização automática a cada 5 segundos · somente leitura</span>
  </footer>
<script>
const DADOS_URL = "https://wwbnzcrmcnmpadpbheeb.supabase.co/functions/v1/painel/dados?token=d460787346335757e00ddbcee860642013f2ae0886bccaa2&apikey=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3Ym56Y3JtY25tcGFkcGJoZWViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2ODk4MjMsImV4cCI6MjExMDI2NTgyM30.Hr7XZTvAHKbT3QGsJqNBk24TaW2lVYlbLpAahAOCEjY";
const COLS = [
  { id: "pago", title: "Pago" },
  { id: "aguardando_material", title: "Aguardando material" },
  { id: "em_producao", title: "Em produção" },
  { id: "pronto", title: "Pronto" },
  { id: "enviado", title: "Enviado" },
];
const FAIXA = {
  ok: "No prazo",
  atencao: "Atenção",
  urgente: "Urgente",
  atrasado: "Atrasado",
  sem_prazo: "Sem prazo",
};
const TZ = "America/Sao_Paulo";
const UN = { unidade: "un", metro: "m", quilo: "kg" };

function tick() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString("pt-BR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit" });
  document.getElementById("date").textContent = now.toLocaleDateString("pt-BR", { timeZone: TZ, weekday: "long", day: "2-digit", month: "long", year: "numeric" });
}
tick();
setInterval(tick, 1000);

function fmtDias(n, faixa) {
  if (n == null) return FAIXA[faixa] || "Sem prazo";
  if (n < 0) return Math.abs(n) + " dia(s) de atraso";
  if (n === 0) return "Despacho hoje";
  if (n === 1) return "1 dia restante";
  return n + " dias restantes";
}
function fmtUn(u) { return UN[u] || u || ""; }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

function render(rows) {
  const root = document.getElementById("root");
  if (!rows || !rows.length) {
    root.className = "empty";
    root.innerHTML = "<h2>Nenhum pedido em andamento</h2><p>O painel está vazio. Quando entrar um pedido pago, ele aparece aqui.</p>";
    return;
  }
  root.className = "board";
  const by = Object.fromEntries(COLS.map(c => [c.id, []]));
  for (const r of rows) {
    const col = r.coluna_kanban || r.status;
    if (by[col]) by[col].push(r);
    else if (by.pago) by.pago.push(r);
  }
  for (const id of Object.keys(by)) {
    by[id].sort((a,b) => {
      const da = a.dias_restantes, db = b.dias_restantes;
      if (da == null && db == null) return 0;
      if (da == null) return 1;
      if (db == null) return -1;
      return da - db;
    });
  }
  root.innerHTML = COLS.map(c => {
    const list = by[c.id] || [];
    const cards = list.length ? list.map(cardHtml).join("") : '<div class="empty-col">Nenhum pedido nesta coluna</div>';
    return `<section class="col ${c.id}"><div class="col-h"><h2>${c.title}</h2><span class="count">${list.length}</span></div><div class="cards">${cards}</div></section>`;
  }).join("");
}

function cardHtml(r) {
  const faixa = r.faixa_prazo || "sem_prazo";
  const faltas = Array.isArray(r.materiais_faltando) ? r.materiais_faltando : [];
  const bloqueado = r.status === "aguardando_material" && faltas.length > 0;
  const faltasHtml = bloqueado ? `<div class="faltas"><strong>Material faltando</strong><ul>${
    faltas.map(f => `<li>${esc(f.nome || f.sku)} — ${esc(f.faltante)} ${esc(fmtUn(f.unidade))}</li>`).join("")
  }</ul></div>` : "";
  const despacho = r.data_despacho_limite ? r.data_despacho_limite.split("-").reverse().join("/") : "—";
  return `<article class="card ${faixa}${bloqueado ? " bloqueado" : ""}">
    <div class="sku">${esc(r.pedido_id)} · ${esc(r.sku_produto)} · despacho ${esc(despacho)}</div>
    <div class="nome">${esc(r.nome_produto)}</div>
    <div class="meta">
      <span class="badge ${faixa}">${esc(fmtDias(r.dias_restantes, faixa))}</span>
      <span class="qtd">Qtd ${esc(r.quantidade)}</span>
    </div>
    ${faltasHtml}
  </article>`;
}

async function refresh() {
  try {
    const res = await fetch(DADOS_URL, { cache: "no-store", mode: "cors", credentials: "omit" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data && data.ok === false) throw new Error(data.error || "resposta inválida");
    render(data.pedidos || []);
    const n = (data.pedidos || []).length;
    document.getElementById("status").textContent = "Atualizado às " +
      new Date().toLocaleTimeString("pt-BR", { timeZone: TZ }) +
      " · " + n + (n === 1 ? " pedido" : " pedidos");
  } catch (e) {
    document.getElementById("status").innerHTML = '<span class="err">Falha ao atualizar: ' + esc(e.message) + "</span>";
  }
}
refresh();
setInterval(refresh, 5000);
</script>
